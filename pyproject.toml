[project]
name = "llm-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Padma Iyer", email = "padmaiyer01@protonmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.34.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
llm-assistant = "llm_assistant:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
